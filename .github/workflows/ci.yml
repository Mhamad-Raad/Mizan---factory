name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

# The job reads the repository and uploads artifacts; it writes nothing back to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://mizan_app:mizan_app@localhost:5432/mizan_test
      DATABASE_MIGRATE_URL: postgresql://mizan_migrate:mizan_migrate@localhost:5432/mizan_test
      TEST_DATABASE_URL: postgresql://mizan_app:mizan_app@localhost:5432/mizan_test
      TEST_MIGRATE_URL: postgresql://mizan_migrate:mizan_migrate@localhost:5432/mizan_test
      SESSION_PEPPER: ci-pepper-not-a-secret-0123456789
      APP_BASE_URL: http://localhost:5173
      TZ: Asia/Baghdad
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The version comes from package.json's packageManager; naming it here too is refused.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Rule 5: logical CSS properties only, enforced by stylelint.
      - name: Lint (including the logical-property rule)
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck

      # Rule 6: the build fails on a string missing from any of the three languages.
      - name: Translation completeness
        run: pnpm check:i18n
      - name: Token contrast (WCAG 2.1 AA, computed from the token sheet)
        run: pnpm check:contrast

      - name: Create the test database and roles
        run: |
          psql -c "CREATE ROLE mizan_migrate LOGIN PASSWORD 'mizan_migrate' CREATEDB;"
          psql -c "CREATE ROLE mizan_app LOGIN PASSWORD 'mizan_app';"
          psql -c "CREATE DATABASE mizan_test OWNER mizan_migrate;"
          psql -d mizan_test -c "GRANT ALL ON SCHEMA public TO mizan_migrate;"
      - name: Migrate
        run: pnpm db:migrate

      # Rule 4: a route without a permission declaration fails the build.
      - name: Every API route declares how it is protected
        run: pnpm check:routes

      - name: Unit and API integration tests
        run: pnpm test

      # A database fit to run on has an admin, as every deployment does after its seed. The
      # tests leave the database in whatever state their last file did, so seed it here.
      - name: Seed the first admin
        run: pnpm db:seed
        env:
          FIRST_ADMIN_PASSWORD: ci-admin-not-a-secret-2026

      # NFR-08: the checks a restored database must satisfy. Run here against the test
      # database, so a change that breaks a ledger invariant fails before a restore drill does.
      - name: Ledger and schema integrity
        run: pnpm check:integrity
        env:
          DATABASE_MIGRATE_URL: postgresql://mizan_migrate:mizan_migrate@localhost:5432/mizan_test

      - name: Build
        run: pnpm build
      - name: Bundle budget (initial JavaScript ≤ 250 kB gzipped, NFR-03)
        run: pnpm --filter @mizan/web check:budget

      # NFR-03 on the reference device: 400 kbps, 400 ms round trip, CPU throttled 4×. The
      # thresholds are the measured ones, with the reasoning in docs/LIGHTHOUSE.md.
      - name: Lighthouse on the reference profile
        run: pnpm exec lhci autorun
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

      # Visual and RTL regression on the key screens, in both directions and both themes.
      - name: Install the browser for the screenshot tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Screenshot and RTL checks
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The inline scripts are allowed by hash; the web image computes the hashes from the page
      # it serves. Here: every inline script of the built page is found and hashed.
      - name: CSP hashes of the inline scripts
        run: |
          test -f apps/web/dist/index.html || pnpm --filter @mizan/web build
          HASHES="$(node ops/docker/csp-hashes.mjs apps/web/dist/index.html)"
          echo "inline script hashes: $HASHES"
          test "$(echo "$HASHES" | wc -w)" -ge 2

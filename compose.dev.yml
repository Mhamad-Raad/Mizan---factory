# Development: PostgreSQL only. The API and the SPA run from the workspace with `pnpm dev`,
# so a change is visible immediately instead of through an image rebuild.

name: mizan-dev

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan_migrate
      POSTGRES_PASSWORD: mizan_migrate
      TZ: Asia/Baghdad
    ports: ['5432:5432']
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mizan_migrate -d mizan']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dev-db-data:

# Mizan — production and staging topology (spec 2.14).
#
# Four services: Caddy serving the SPA and proxying /api, the API, PostgreSQL with a
# persistent volume, and a backup container. One API replica is enough at the design volumes
# of NFR-13; a second is `docker compose up --scale api=2`, which is why nothing in the API
# keeps state in process memory.

name: mizan

# Docker's default json-file logs grow without end on the disk the database lives on; five
# years unattended would fill it. Every service rotates at 5 x 10 MB (D-115).
x-logging: &logging
  driver: local
  options: { max-size: '10m', max-file: '5' }

services:
  web:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.web
    environment:
      MIZAN_DOMAIN: ${MIZAN_DOMAIN:?set the domain}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  api:
    # One tag for the API and the migrate job, so the migrations that run are the ones the API
    # was built with (`MIZAN_IMAGE_TAG`, e.g. the release tag; `local` when unset).
    image: mizan-api:${MIZAN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Baghdad
      # One proxy (Caddy, below) stands in front of the API, so `request.ip` is the browser's.
      TRUST_PROXY: '1'
      # The application role only: it reads the list of applied migrations to refuse to start
      # on a pending one, and has no use for the role that owns the schema (security review, 9).
      DATABASE_URL: ${DATABASE_URL:?}
      SESSION_PEPPER: ${SESSION_PEPPER:?}
      APP_BASE_URL: ${APP_BASE_URL:?}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-admin}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
    depends_on:
      db: { condition: service_healthy }
    # A small init as PID 1 with the API as its child: the kernel drops a signal sent from inside
    # the container to a PID 1 that has no handler for it, and the API installs none, so the
    # healthcheck below could not otherwise end it (D-115).
    init: true
    # Docker never restarts a container that is only unhealthy, and a hung API is exactly that.
    # So the check ends the API itself: three failures in a row (about ninety seconds without an
    # answer) send it SIGTERM, a fourth SIGKILL, and `restart` brings it back. No autoheal
    # sidecar: that needs the Docker socket, which is root on the host (D-115). The image has
    # node but no curl or wget. The count lives in /tmp, keyed to this start of the container,
    # and failures in the first two minutes are not counted so a slow start is never killed.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const fs = require('fs'), F = '/tmp/mizan-health-failures';
          const start = fs.readFileSync('/proc/1/stat', 'utf8').split(') ')[1].split(' ')[19];
          const age = parseFloat(fs.readFileSync('/proc/uptime', 'utf8')) - start / 100;
          let n = 0;
          try { const [s, c] = fs.readFileSync(F, 'utf8').split(' '); if (s === start) n = +c; } catch {}
          const done = (ok) => {
            n = ok || age < 120 ? 0 : n + 1;
            fs.writeFileSync(F, start + ' ' + n);
            if (n >= 3) for (const p of fs.readdirSync('/proc')) if (/^\d/.test(p)) try {
              if (fs.readFileSync('/proc/' + p + '/cmdline', 'utf8') === 'node\0apps/api/dist/main.js\0')
                process.kill(+p, n > 3 ? 'SIGKILL' : 'SIGTERM');
            } catch {}
            process.exit(ok ? 0 : 1);
          };
          fetch('http://127.0.0.1:3000/api/v1/health', { signal: AbortSignal.timeout(8000) })
            .then((r) => done(r.ok), () => done(false));
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s
    restart: unless-stopped
    logging: *logging

  # The one-off migration job (runbook, "Ordinary deployment"): the same image as the API, the
  # only container that is handed the migrate role. `docker compose run --rm migrate`; the
  # profile keeps `docker compose up` from starting it.
  migrate:
    image: mizan-api:${MIZAN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.api
    profiles: ['tools']
    environment:
      NODE_ENV: production
      TZ: Asia/Baghdad
      DATABASE_MIGRATE_URL: ${DATABASE_MIGRATE_URL:?}
    command: ['node', 'apps/api/dist/database/migrate.js']
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  db:
    image: postgres:15-alpine
    # The wal-archive volume is created owned by root, and PostgreSQL archives as `postgres`:
    # without this every archive_command failed ("Permission denied"), nothing was archived, and
    # pg_wal kept every segment until the disk filled. Handed over on every start, before the
    # image's own entrypoint drops to `postgres`.
    entrypoint:
      - /bin/sh
      - -c
      - chown postgres:postgres /wal-archive && exec docker-entrypoint.sh "$$@"
      - db-entrypoint
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mizan}
      POSTGRES_USER: ${POSTGRES_USER:-mizan_migrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Read once, when the volume is first initialised: ops/docker/db-init creates the backup
      # container's own role, mizan_backup, with this password.
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?the password of the mizan_backup role}
      TZ: Asia/Baghdad
    command:
      # Continuous WAL archiving is standard, not optional: a cash ledger cannot afford to
      # lose a day, and the recovery point objective is fifteen minutes (NFR-08). A segment is
      # closed at least every ten minutes and the backup container sends it off the host within
      # five, so the WAL off-site is never more than fifteen minutes behind. The weekly base
      # backup (ops/backup/basebackup.sh) is what that WAL is replayed onto.
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh %p %f
      - -c
      - archive_timeout=600
      - -c
      - wal_level=replica
      - -c
      - log_min_duration_statement=500
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./ops/backup/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
      - wal-archive:/wal-archive
      # First initialisation only: the mizan_backup role and its replication entry in pg_hba.
      - ./ops/docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mizan_migrate} -d ${POSTGRES_DB:-mizan}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  backup:
    # pg_dump plus `openssl` and the `aws` client: the stock postgres image has neither, and a
    # backup that cannot leave the host fails instead of pretending (security review, 10).
    # Nightly dump, weekly base backup, WAL every five minutes — all encrypted and tagged before
    # they leave (ops/backup, runbook "Backups").
    build:
      context: ops/docker
      dockerfile: Dockerfile.backup
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-mizan}
      # Its own least-privilege role (read everything, replicate, write nothing) — never the
      # schema owner, which can rewrite the ledgers.
      PGUSER: mizan_backup
      PGPASSWORD: ${BACKUP_DB_PASSWORD:?the password of the mizan_backup role}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?}
      # The dead-man's switch. Required: it is also how a filling disk is reported, and with no
      # one watching the server an unset alert is a failure nobody hears of (D-115).
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:?set BACKUP_HEARTBEAT_URL to a dead-man's-switch ping URL (runbook, "Backups")}
      # Off-site retention is the bucket's lifecycle rules (runbook); 1 prunes from here instead,
      # which needs a key that may list and delete.
      BACKUP_PRUNE_OFFSITE: ${BACKUP_PRUNE_OFFSITE:-0}
      # The off-site store's credentials. For Backblaze B2, Wasabi or any S3-compatible store,
      # also set AWS_ENDPOINT_URL to its endpoint.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?the off-site backup store's access key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?the off-site backup store's secret key}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      TZ: Asia/Baghdad
    entrypoint: ['/bin/sh', '/opt/mizan/cron.sh']
    volumes:
      - ./ops/backup:/opt/mizan:ro
      - wal-archive:/wal-archive
      - backup-staging:/var/backups/mizan
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  wal-archive:
  caddy-data:
  caddy-config:
  backup-staging:
